name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build Lean library
        uses: leanprover/lean-action@v1
        with:
          build-args: "LeanCcg"

      - name: Check examples 
        run: lake env lean Example.lean
        
